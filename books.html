<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online Library</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <header class="header">
    <h1 class="site-title">Online Book Library</h1>
    <button class="sign-in" disabled>Sign In</button>
  </header>

  <div class="top-controls">
    <h1 class="adaptive-title">ONLINE LIBRARY</h1>
    <div class="filter-sort-buttons">
  <button class="filter-btn">Filter</button>
</div>
  </div>

  <main class="container">
    <aside class="filters">
      <h2>Filter</h2>

      <div class="filter-group">
        <h3>Genre</h3>
        <label><input type="checkbox" checked> Roman</label>
        <label><input type="checkbox" checked> Non-Fiction</label>
      </div>

      <div class="filter-group">
        <h3>Author</h3>
        <input type="text" placeholder="Enter author">
      </div>

      <div class="filter-group">
        <h3>Year</h3>
        <label><input type="checkbox"> 1900</label>
        <label><input type="checkbox"> 2024</label>
      </div>

      <div class="filter-group">
        <h3>Language</h3>
        <label><input type="checkbox" checked> English</label>
        <label><input type="checkbox"> Українська</label>
      </div>
    </aside>

    <section class="content">
    <div class="content-header">
    <h2 class="section-title">Featured</h2>
    <select class="sort-select">
      <option value="">Sort by:</option>
      <option value="year">Year</option>
      <option value="genre">Genre</option>
    </select>
  </div>
  
      <div class="book-list">
      </div>
    </section>
  </main>
<script src="books.js"></script>
</body>
</html>
