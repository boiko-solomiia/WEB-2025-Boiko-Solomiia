<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report</title>

  <!-- WebDataRocks CDN -->
  <link href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css" rel="stylesheet"/>
  <script src="https://cdn.webdatarocks.com/latest/webdatarocks.toolbar.min.js"></script>
  <script src="https://cdn.webdatarocks.com/latest/webdatarocks.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 1rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    #pivot-container {
      height: 500px;
    }
  </style>
</head>
<body>
  <h1>Report</h1>
  <div id="pivot-container"></div>

  <script>
    fetch("books.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("File not found or server error.");
        }
        return response.json();
      })
      .then(data => {
        // Transform to ENGLISH field names
        const transformed = data.map(book => ({
          Name: book.title,
          Author: book.author,
          Genre: book.genre,
          Year: book.year,
          Language: book.language
        }));

        new WebDataRocks({
          container: "#pivot-container",
          toolbar: true,
          height: "100%",
          report: {
            dataSource: {
              data: transformed
            },
            slice: {
              rows: [{ uniqueName: "Genre" }],
              columns: [{ uniqueName: "Year" }],
              measures: [{ uniqueName: "Name", aggregation: "count" }]
            }
          }
        });
      })
      .catch(error => {
        alert("Failed to load books.json. Please check the file and path.");
        console.error(error);
      });
  </script>
</body>
</html>
